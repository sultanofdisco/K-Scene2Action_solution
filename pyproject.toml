[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "k-scene2action-f1"
version = "0.1.0"
description = "F1 input and output interfaces for K-Scene2Action configuration C"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.3,<4",
    "paddlepaddle>=3.2,<4",
    "Pillow>=10.4,<13",
    "huggingface-hub>=0.30,<1",
]
train = [
    "numpy>=1.26,<3",
    "Pillow>=10.4,<13",
    "torch>=2.6,<3",
    "sentence-transformers>=5,<6",
    "transformers>=4.46,<5",
    "safetensors>=0.4,<1",
]
laya = [
    "laya==0.3.27",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/f1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
